<!DOCTYPE html>
<html>
    <head>
        <title>internet status and clock</title>
        
        <style>
             body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
     
    }

    .clock {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: black;
    }

    .time {
      font-size: clamp(64px, 16vw, 240px);
      font-weight: bold;
      color: white;

    }

    .date-time {
      font-size: small;
      font-weight: bold;
      color: rgb(255, 147, 85);

    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 1.2vw, 18px);
    }

    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 36px);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffcc66;
      font-size: clamp(14px, 2vw, 24px);
      font-weight: bold;
      white-space: nowrap;
    }

    .status.up {
      color: #4caf50;
    }

    .status.down {
      color: #f44336;
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      background-color: currentColor;
    }

    @media screen and (max-width: 1024px) {
      .date-time {
        font-size: 24px;
      }
    }
               
        </style>
    
  </head>
  <body>
    <div class="clock">
      <div class="clock-row">
        <div class="time"></div>
      </div>
      <div class="date-row">
        <div id="status" class="status checking" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="label">CHECKING</span>
        </div>
        <div class="date-time"></div>
      </div>
    </div>


<script>
  // digital clock
  var time = document.querySelector('.time');
  var dateTime = document.querySelector('.date-time');
  var internetStatus = document.getElementById('status');
  var label = document.getElementById('label');

  // internet status
  const ENDPOINTS = [
    { name: "Google", url: "https://www.gstatic.com/generate_204"},
    { name: "Cloudflare", url: "https://1.1.1.1/cdn-cgi/trace"},
    { name: "Microsoft", url: "https://www.msftconnecttest.com/connecttest.txt"}
  ];
  const TIMEOUT_MS = 5000;
  const REFRESH_S = 60;
  function probe(ep){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const url = ep.url + "?_=" + Date.now(); // cache-busting query parameter
    return fetch(url, { mode: 'no-cors', signal: ctrl.signal })
      .then(() => ({ name: ep.name, ok: true }))
      .catch(() => ({ name: ep.name, ok: false }))
      .finally(() => clearTimeout(timer));
  }

  function firstSuccess(probes){
    return new Promise((resolve, reject) => {
      let failedCount = 0;
      probes.forEach(p => {
        p.then(result => {
          if (result.ok) {
            resolve(result);
          } else {
            failedCount++;
            if (failedCount === probes.length) {
              reject(new Error("All probes failed"));
            }
          }
        }).catch(() => {
          failedCount++;
          if (failedCount === probes.length) {
            reject(new Error("All probes failed"));
          }
        });
      });
    });
  }

  function render(up){
    internetStatus.classList.toggle('up', up);
    internetStatus.classList.toggle('down', !up);
    internetStatus.classList.remove('checking');
    label.textContent = up ? 'ONLINE' : 'OFFLINE';
  }

  function checkInternet(){
    firstSuccess(ENDPOINTS.map(probe))
      .then(() => render(true))
      .catch(() => render(false));
  }

  checkInternet();
  setInterval(checkInternet, REFRESH_S * 1000);

  // digital clock
  function updateClock() {
    // Get the current time, day , month and year
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    //var seconds = now.getSeconds();
    var day = now.getDay();
    var date = now.getDate();
    var month = now.getMonth();
    var year = now.getFullYear();

    // store day and month name in an array
    var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      // format date and time
      //hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      //seconds = seconds < 10 ? '0' + seconds : seconds;
      date = date < 10 ? '0' + date : date;

      // display date and time
      //var period = hours < 12 ? 'PM' : 'AM';
      //time.innerHTML = hours + ':' + minutes + ':' + seconds + ' ' + period;
      time.style.color = hours > 20 ? 'red' : 'white';
      time.innerHTML = hours + ':' + minutes ;
      dateTime.innerHTML = dayNames[day] + '<br>    ' + date +  ' ' + monthNames[month] + ' ' + year;
  }

  updateClock();
  setInterval(updateClock, 60000); // shows accuracy to 60 seconds
  setTimeout(function () {
    time.style.color = 'white';
  }, 30 * 60 * 1000);

</script>
<noscript>Sorry, your browser does not have JavaScript enabled</noscript>
</body>
</html>
