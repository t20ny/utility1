<!DOCTYPE html>
<html>
    <head>
        <title>internet status and clock</title>
        
        <style>
             body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
     
    }

    .clock {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: black;
    }

    .clock.down {
      background-color: #b00020;
    }

    .time {
      font-size: clamp(64px, 16vw, 240px);
      font-weight: bold;
      color: white;

    }

    .date-time {
      font-size: small;
      font-weight: bold;
      color: rgb(255, 147, 85);

    }

    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 3vw, 36px);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 1.2vw, 18px);
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 420px;
      gap: clamp(10px, 1vw, 14px);
      padding-left: clamp(12px, 3vw, 32px);
    }

    .info-box {
      display: flex;
      align-items: center;
      gap: 8px;
      color: lightgray;
      font-size: clamp(12px, 1.2vw, 18px);
      font-weight: normal;
      white-space: nowrap;
    }

    .info-label {
      color: lightgray;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffcc66;
      font-size: clamp(14px, 2vw, 30px);
      font-weight: bold;
      white-space: nowrap;
    }

    .status.up {
      color: #4caf50;
    }

    .status.down {
      color: red;
      background: white;
      border: 3px solid red;
      border-radius: 8px;
      padding: 4px 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
      background-color: currentColor;
    }

    @media screen and (max-width: 1024px) {
      .date-time {
        font-size: 24px;
      }
    }

    .info {
      display: flex;
      align-items: left;
      gap: 8px;
      color: #ffcc66;
      font-size: clamp(10px, 1vw, 16px);
      white-space: nowrap;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: repeat(4, max-content);
      align-items: center;
      width: 100%;
      max-width: 420px;
      column-gap: clamp(12px, 2vw, 24px);
      row-gap: 8px;
      padding-left: clamp(12px, 3vw, 32px);
      margin-top: 8px;
    }

    .provider-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
      font-size: clamp(10px, 1vw, 16px);
      white-space: nowrap;
    }

    .provider-status.success {
      color: #4caf50;
    }

    .provider-status.failure {
      color: #f44336;
    }

    .provider-status .dot {
      width: 10px;
      height: 10px;
      flex-basis: 10px;
    }

    .latency-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #888;
      font-size: clamp(10px, 1vw, 16px);
      white-space: nowrap;
    }

    .latency-status.faster {
      color: #4caf50;
    }

    .latency-status.slower {
      color: #f44336;
    }

        </style>
    
  </head>
  <body>
    <div class="clock">
      <div class="clock-row">
        <div class="time"></div>
      </div>
      <div class="date-row">
        <div id="status" class="status checking" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="label">CHECKING</span>
        </div>
        <div class="date-time"></div>
      </div>
      <div class="info-row">
        <div id="info" class="info-box">
          <span class="info-label">last status check:</span>
          <span id="checked">-</span>

          <span class="info-label">&nbsp;|&nbsp;last status change:</span>
          <span id="changed">-</span>
        </div>
      </div>
      <div class="provider-grid" role="group" aria-label="Provider statuses and response times">
        <!-- current response status -->
        <div class="provider-status" data-provider="Google" aria-label="Google: not checked" title="Google: not checked">
          <span class="dot" aria-hidden="true"></span>
          <span>Google</span>
        </div>
        <div class="provider-status" data-provider="Cloudflare" aria-label="Cloudflare: not checked" title="Cloudflare: not checked">
          <span class="dot" aria-hidden="true"></span>
          <span>Cloudflare</span>
        </div>
        <div class="provider-status" data-provider="Microsoft" aria-label="Microsoft: not checked" title="Microsoft: not checked">
          <span class="dot" aria-hidden="true"></span>
          <span>Microsoft</span>
        </div>
        <div class="provider-status" data-provider="Amazon" aria-label="Amazon: not checked" title="Amazon: not checked">
          <span class="dot" aria-hidden="true"></span>
          <span>Amazon</span>
        </div>
        <!-- Provider response times -->
        <div class="latency-status" data-latency="Google" aria-label="Google: no response time yet" title="Google: no response time yet">
          <span>Gg</span>
          <span class="latency-value">-- ms</span>
        </div>
        <div class="latency-status" data-latency="Cloudflare" aria-label="Cloudflare: no response time yet" title="Cloudflare: no response time yet">
          <span>Cf</span>
          <span class="latency-value">-- ms</span>
        </div>
        <div class="latency-status" data-latency="Microsoft" aria-label="Microsoft: no response time yet" title="Microsoft: no response time yet">
          <span>Ms</span>
          <span class="latency-value">-- ms</span>
        </div>
        <div class="latency-status" data-latency="Amazon" aria-label="Amazon: no response time yet" title="Amazon: no response time yet">
          <span>Az</span>
          <span class="latency-value">-- ms</span>
        </div>
      </div>
    </div>


<script>
  // digital clock
  var time = document.querySelector('.time');
  var dateTime = document.querySelector('.date-time');

  // internet status
  var internetStatus = document.getElementById('status');
  var clock = document.querySelector('.clock');
  var label = document.getElementById('label');
  var checked = document.getElementById('checked');
  var changed = document.getElementById('changed');
  var lastStatus = null;
  var lastChange = null;

  const ENDPOINTS = [
    { name: "Google", url: "https://www.gstatic.com/generate_204"},
    { name: "Cloudflare", url: "https://1.1.1.1/cdn-cgi/trace"},
    { name: "Microsoft", url: "http://www.msftconnecttest.com/connecttest.txt"},
    { name: "Amazon", url: "https://checkip.amazonaws.com"}
  ];
  const TIMEOUT_MS = 5000;
  const REFRESH_S = 15;
  const latencyHistory = new Map(ENDPOINTS.map(ep => [ep.name, []]));
  function probe(ep){
    const startedAt = performance.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const url = ep.url + "?_=" + Date.now(); // cache-busting query parameter
    return fetch(url, { mode: 'no-cors', signal: ctrl.signal })
      .then(() => ({ name: ep.name, ok: true, durationMs: performance.now() - startedAt }))
      .catch(() => ({ name: ep.name, ok: false, durationMs: performance.now() - startedAt }))
      .finally(() => clearTimeout(timer));
  }

  function firstSuccess(probes){
    return new Promise((resolve, reject) => {
      let failedCount = 0;
      probes.forEach(p => {
        p.then(result => {
          if (result.ok) {
            resolve(result);
          } else {
            failedCount++;
            if (failedCount === probes.length) {
              reject(new Error("All probes failed"));
            }
          }
        }).catch(() => {
          failedCount++;
          if (failedCount === probes.length) {
            reject(new Error("All probes failed"));
          }
        });
      });
    });
  }

  function formatTime(value) {
    return value.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function render(up){
    var now = new Date();

    if (lastStatus !== up) {
      lastStatus = up;
      lastChange = now;
    }

    internetStatus.classList.toggle('up', up);
    internetStatus.classList.toggle('down', !up);
    clock.classList.toggle('down', !up);
    internetStatus.classList.remove('checking');
    label.textContent = up ? 'ONLINE' : 'OFFLINE';
    checked.textContent = formatTime(now);
    changed.textContent = lastChange ? formatTime(lastChange) : '-';
  }

  function checkInternet(){
    var probes = ENDPOINTS.map(probe);
    probes.forEach(p => p.then(updateProviderStatus));
    probes.forEach(p => p.then(updateProviderLatency));
    firstSuccess(probes)
      .then(() => render(true))
      .catch(() => render(false));
  }

  function updateProviderStatus(result){
    var provider = document.querySelector('[data-provider="' + result.name + '"]');
    var state = result.ok ? 'success' : 'failure';
    var description = result.ok ? 'online' : 'offline';
    provider.classList.remove('success', 'failure');
    provider.classList.add(state);
    provider.setAttribute('aria-label', result.name + ': ' + description);
    provider.title = result.name + ': ' + description;
  }

  function updateProviderLatency(result){
    var latency = document.querySelector('[data-latency="' + result.name + '"]');
    if (!latency) return;

    var value = latency.querySelector('.latency-value');
    var history = latencyHistory.get(result.name);
    var state = '';
    var description;

    if (!result.ok) {
      value.textContent = '-- ms';
      description = 'response unavailable; excluded from the average';
    } else {
      var average = history.length === 10
        ? history.reduce((total, duration) => total + duration, 0) / history.length
        : null;
      var duration = Math.round(result.durationMs);
      value.textContent = duration + ' ms';

      if (average === null) {
        description = 'no comparison yet; ' + history.length + ' of 10 previous successful checks';
      } else if (result.durationMs < average) {
        state = 'faster';
        description = 'faster than the previous 10 successful-check average of ' + Math.round(average) + ' ms';
      } else if (result.durationMs > average) {
        state = 'slower';
        description = 'slower than the previous 10 successful-check average of ' + Math.round(average) + ' ms';
      } else {
        description = 'equal to the previous 10 successful-check average of ' + Math.round(average) + ' ms';
      }

      history.push(result.durationMs);
      if (history.length > 10) history.shift();
    }

    latency.classList.remove('faster', 'slower');
    if (state) latency.classList.add(state);
    latency.setAttribute('aria-label', result.name + ': ' + value.textContent + ', ' + description);
    latency.title = result.name + ': ' + value.textContent + ', ' + description;
  }

  checkInternet();
  setInterval(checkInternet, REFRESH_S * 1000);

  // digital clock
  function updateClock() {
    // Get the current time, day , month and year
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    //var seconds = now.getSeconds();
    var day = now.getDay();
    var date = now.getDate();
    var month = now.getMonth();
    var year = now.getFullYear();

    // store day and month name in an array
    var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      // format date and time
      //hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      //seconds = seconds < 10 ? '0' + seconds : seconds;
      date = date < 10 ? '0' + date : date;

      // display date and time
      //var period = hours < 12 ? 'PM' : 'AM';
      //time.innerHTML = hours + ':' + minutes + ':' + seconds + ' ' + period;
      time.style.color = hours > 20 ? 'red' : 'white';
      time.innerHTML = hours + ':' + minutes ;
      dateTime.innerHTML = dayNames[day] + '<br>    ' + date +  ' ' + monthNames[month] + ' ' + year;
  }

  updateClock();
  setInterval(updateClock, 60000); // shows accuracy to 60 seconds
  setTimeout(function () {
    time.style.color = 'white';
  }, 30 * 60 * 1000);

</script>
<noscript>please enable JavaScript</noscript>
</body>
</html>
